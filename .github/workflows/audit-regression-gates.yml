name: Audit Regression Gates

on:
  pull_request:
    paths:
      - "README.md"
      - "docker/**"
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - "scripts/audit_repo_readiness.py"
      - "scripts/audit_secret_allowlist.toml"
      - "scripts/build_server_deploy_bundle.py"
      - "scripts/verify_server_deploy.py"
      - "scripts/verify_server_deploy.ps1"
      - ".github/workflows/audit-regression-gates.yml"
      - ".github/workflows/release-client.yml"
      - ".github/workflows/release-server.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docker/**"
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - "scripts/audit_repo_readiness.py"
      - "scripts/audit_secret_allowlist.toml"
      - "scripts/build_server_deploy_bundle.py"
      - "scripts/verify_server_deploy.py"
      - "scripts/verify_server_deploy.ps1"
      - ".github/workflows/audit-regression-gates.yml"
      - ".github/workflows/release-client.yml"
      - ".github/workflows/release-server.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pip-audit

      - name: Guard unapproved runtime bazzite literals
        run: |
          python - <<'PY'
          from pathlib import Path

          allowed_paths = {
              Path("src/gamehub_cli/emulators/install_flatpak.py").as_posix(),
          }

          hits: list[str] = []
          for root in (Path("src"),):
              for path in root.rglob("*.py"):
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  if "bazzite" in text.casefold() and path.as_posix() not in allowed_paths:
                      hits.append(str(path))
          if hits:
              print("Disallowed runtime 'bazzite' literal found outside approved allowlist:")
              for hit in sorted(hits):
                  print(f"- {hit}")
              raise SystemExit(1)
          PY

      - name: Config precedence slice
        run: python -m pytest -q -p no:cacheprovider tests/test_cli_config_state.py

      - name: Server refresh cache slice
        run: python -m pytest -q -p no:cacheprovider tests/test_server_api.py

      - name: Architecture guard slice
        run: python -m pytest -q -p no:cacheprovider tests/test_architecture.py

      - name: Local readiness audit
        run: python scripts/audit_repo_readiness.py

      - name: Ruff format check (src)
        run: |
          python -m ruff format --check src

      - name: Ruff lint (src)
        run: |
          python -m ruff check src

      - name: Mypy (src)
        run: |
          python -m mypy src

      - name: Dependency vulnerability audit
        run: |
          pip-audit --progress-spinner off

      - name: Dependency update report
        run: |
          python -m pip list --outdated --format=columns

  server-container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build local server image
        run: docker build -f docker/Dockerfile -t gamehub-server-smoke .

      - name: Verify containerized server
        run: |
          docker run -d --name gamehub-server-smoke \
            -p 127.0.0.1:18000:8000 \
            -v "$PWD/tests/fixtures/indexer_case:/data:ro" \
            gamehub-server-smoke
          python3 scripts/verify_server_deploy.py --base-url http://127.0.0.1:18000 --wait-seconds 30

      - name: Dump container logs on failure
        if: failure()
        run: docker logs gamehub-server-smoke || true

      - name: Clean up container
        if: always()
        run: docker rm -f gamehub-server-smoke || true
