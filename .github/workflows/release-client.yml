name: Client Artifact Release

on:
  push:
    tags:
      - "v*"

jobs:
  linux-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload linux wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheel
          path: dist/*.whl

  linux-pipx-smoke:
    runs-on: ubuntu-latest
    needs: linux-wheel
    container:
      image: fedora:41
    steps:
      - name: Install python + pipx
        run: |
          dnf install -y python3 python3-pip pipx
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: /tmp/dist
      - name: Install and smoke test
        run: |
          pipx install /tmp/dist/*.whl
          ~/.local/bin/gamehub --help
          ~/.local/bin/gamehub sync --help
      - name: Reinstall (upgrade smoke)
        run: |
          pipx install --force /tmp/dist/*.whl
          ~/.local/bin/gamehub --help
          ~/.local/bin/gamehub sync --help

  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean --onefile --name gamehub-windows-amd64 --paths . --paths apps/cli --paths apps/server --paths shared/gamehub_common packaging/windows/entrypoint.py

      - name: Smoke test executable
        run: |
          .\dist\gamehub-windows-amd64.exe --help
          .\dist\gamehub-windows-amd64.exe sync --help

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/gamehub-windows-amd64.exe

  server-deploy-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build server deploy bundle
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          ref_name = "${{ github.ref_name }}"
          bundle_name = f"gamehub-server-deploy-{ref_name}.zip"
          dist = Path("dist")
          dist.mkdir(parents=True, exist_ok=True)
          bundle_path = dist / bundle_name

          sources = [
              Path("docker/compose.yaml"),
              Path(".env.production.template"),
              Path("docs/deployment-server.md"),
              Path("scripts/verify_server_deploy.ps1"),
          ]
          with zipfile.ZipFile(bundle_path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for source in sources:
                  archive.write(source, arcname=source.as_posix())
          print(bundle_path.as_posix())
          PY

      - name: Upload server deploy bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-deploy-bundle
          path: dist/gamehub-server-deploy-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - linux-wheel
      - linux-pipx-smoke
      - windows-exe
      - server-deploy-bundle
    permissions:
      contents: write
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: artifacts

      - name: Download windows executable
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts

      - name: Download server deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: server-deploy-bundle
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
