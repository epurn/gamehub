name: Server Image Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (amd64)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gamehub-server
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f apps/server/Dockerfile \
            --push \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            .
