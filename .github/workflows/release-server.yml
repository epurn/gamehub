name: Server Image Release

on:
  pull_request:
    paths:
      - "apps/server/**"
      - "shared/**"
      - "docker/**"
      - "pyproject.toml"
      - ".github/workflows/release-server.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose -f docker/compose.yaml --env-file .env.production.template config

      - name: Build server image (amd64)
        run: docker build --platform linux/amd64 -f apps/server/Dockerfile .

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (amd64)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gamehub-server
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f apps/server/Dockerfile \
            --push \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            .
