# General Windows template.
# Validated v1 Windows defaults.
[server]
url = "http://<SERVER_IP>:8000"

# Optional index fetch hardening for slower/unreliable links.
# index_timeout_seconds = 45
# index_fetch_attempts = 3
# index_retry_backoff_seconds = 1.5
# Parallel download workers for firmware/ROM/assets (1-16, default 4).
# max_parallel_downloads = 4

[paths]
gamehub_dir = "D:/GameHub"

[steam]
userdata_dir = "C:/Program Files (x86)/Steam/userdata"
# Optional but recommended for deterministic profile targeting.
# Accepts userdata account id or SteamID64.
# steam_id = "76561198000000001"
steam_exe = "C:/Program Files (x86)/Steam/steam.exe"

[sgdb]
# Fallback only; prefer GAMEHUB_SGDB_API_KEY in environment.
# api_key = "<OPTIONAL_SGDB_KEY>"
cache_dir = "D:/GameHub/artwork-cache/sgdb"
enabled_kinds = ["grid", "hero", "logo", "icon"]

[controllers]
# Launch-time shortcut wrapper for PCSX2/Dolphin/Azahar (with controller profile autoconfig).
launch_autoconfig = true
# Optional explicit profile directory.
# Default when omitted: <paths.gamehub_dir>/controller_profiles
# profiles_dir = "D:/GameHub/controller_profiles"

[backups]
# Keep the newest GAMEHUB backup files per target path/family (default 3).
# keep_limit = 3

# Optional Windows Azahar installer override for emulator auto-install:
# set env var GAMEHUB_AZAHAR_WINDOWS_INSTALLER_URL to a tested GitHub release installer URL.
