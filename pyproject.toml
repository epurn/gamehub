[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamehub"
dynamic = ["version"]
description = "GAMEHUB server and CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "evdev>=1.9.0; sys_platform == 'linux'",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "platformdirs>=4.3.0",
  "pydantic>=2.11.0",
  "rich>=14.0.0",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
  "vdf>=3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pyinstaller>=6.10.0",
  "build>=1.2.2",
  "ruff>=0.11.0",
  "mypy>=1.11.0",
]

[project.scripts]
gamehub = "gamehub_cli.main:main"
gamehub-server = "gamehub_server.main:run"

[tool.setuptools.dynamic]
version = { attr = "gamehub_common.version.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["gamehub_cli*", "gamehub_server*", "gamehub_common*"]

[tool.setuptools.package-data]
gamehub_cli = ["steam/template_seeds/**/*.vdf", "steam/template_seeds/**/*.md"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
