services:
  gamehub-server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      platforms:
        - linux/amd64
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/gamehub-server:${GAMEHUB_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      GAMEHUB_DATA_DIR: /data
    ports:
      - "${GAMEHUB_SERVER_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${GAMEHUB_DATA_HOST_PATH:-../data}
        target: /data
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
