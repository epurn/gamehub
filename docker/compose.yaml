services:
  gamehub-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${GAMEHUB_SERVER_IMAGE:-ghcr.io/epurn/gamehub-server}:${GAMEHUB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      GAMEHUB_DATA_DIR: /data
      GAMEHUB_INDEX_POLL_SECONDS: ${GAMEHUB_INDEX_POLL_SECONDS:-1}
      GAMEHUB_INDEX_STABLE_SECONDS: ${GAMEHUB_INDEX_STABLE_SECONDS:-2}
      GAMEHUB_INDEX_REFRESH_SECONDS: ${GAMEHUB_INDEX_REFRESH_SECONDS:-0}
      GAMEHUB_HASH_CACHE_PATH: ${GAMEHUB_HASH_CACHE_PATH:-/app/.cache/gamehub/hash-cache.sqlite3}
      GAMEHUB_BACKUP_KEEP_LIMIT: ${GAMEHUB_BACKUP_KEEP_LIMIT:-3}
    ports:
      - "${GAMEHUB_SERVER_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${GAMEHUB_DATA_HOST_PATH:-../data}
        target: /data
      - type: volume
        source: gamehub-hash-cache-v2
        target: /app/.cache/gamehub
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gamehub-hash-cache-v2:
